server:
  port: 8080
spring:
  application:
    name: rag-cache-spring-ai-ollama
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2:latest}
          temperature: 0.2
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
logging:
  level:
    com.example.ragcache: INFO
