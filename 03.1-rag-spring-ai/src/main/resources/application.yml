server:
  port: 8080

spring:
  application:
    name: 03-rag-spring-ai
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2:latest}
          temperature: 0.2
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      init:
        # Pulls both the chat model and the embedding model on first run if missing.
        pull-model-strategy: when_missing

logging:
  level:
    com.acmesupport: INFO
    org.springframework.ai: INFO
