spring.application.name=spring-ai-ollama-sarvam
server.port=8080

# Ollama runs locally; no Sarvam cloud API key is needed for local inference.
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:frob/sarvam}
spring.ai.ollama.chat.options.temperature=0.2

# Helpful for seeing startup and request errors during a lab.
logging.level.org.springframework.ai=INFO
