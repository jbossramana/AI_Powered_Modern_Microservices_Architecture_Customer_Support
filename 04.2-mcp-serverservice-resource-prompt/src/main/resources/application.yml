server:
  port: 8085

spring:
  application:
    name: support-mcp-server
  ai:
    mcp:
      server:
        name: customer-support-mcp-server
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        annotation-scanner:
          enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
