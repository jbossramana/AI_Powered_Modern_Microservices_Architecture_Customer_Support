server:
  port: 8080

spring:
  application:
    name: spring-ai-advisor-guardrails
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.2

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
    com.example.support: INFO
