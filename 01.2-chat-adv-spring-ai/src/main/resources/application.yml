server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: spring-ai-enterprise-feature-lab
  ai:
    model:
      chat: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
          temperature: ${OLLAMA_TEMPERATURE:0.2}
management:
  endpoints:
    web:
      exposure:
        include: health,info
