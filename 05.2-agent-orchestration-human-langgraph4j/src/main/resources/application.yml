server:
  port: 8080

spring:
  application:
    name: 05-agent-orchestration-langgraph4j
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2:latest}
          temperature: 0.2
      init:
        pull-model-strategy: when_missing

logging:
  level:
    com.acmesupport: INFO
    org.bsc.langgraph4j: INFO
