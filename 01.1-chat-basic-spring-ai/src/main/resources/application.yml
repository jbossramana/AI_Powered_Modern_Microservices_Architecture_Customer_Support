server:
  port: 8080

spring:
  application:
    name: 00-chat-spring-ai
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2:latest}
          temperature: 0.4
      init:
        # Auto-pull the model on startup if it isn't already present locally.
        # Handy for a first run; turn off once you manage models yourself.
        pull-model-strategy: when_missing

logging:
  level:
    com.acmesupport: INFO
    org.springframework.ai: INFO
