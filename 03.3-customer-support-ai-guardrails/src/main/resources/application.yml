server:
  port: 8080
spring:
  application:
    name: customer-support-ai
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3.2:latest}
        options:
          temperature: 0.2
          num-ctx: 4096
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    org.springframework.ai: INFO
