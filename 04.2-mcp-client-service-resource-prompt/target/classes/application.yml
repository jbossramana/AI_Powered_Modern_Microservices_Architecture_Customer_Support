server:
  port: 8080

spring:
  application:
    name: support-mcp-client

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5:3b}
          temperature: 0.2

    mcp:
      client:
        enabled: true
        name: support-ai-client
        version: 1.0.0
        type: SYNC
        request-timeout: 30s
        streamable-http:
          connections:
            support-server:
              url: ${MCP_SERVER_URL:http://localhost:8085}
              endpoint: /mcp

management:
  endpoints:
    web:
      exposure:
        include: health,info
