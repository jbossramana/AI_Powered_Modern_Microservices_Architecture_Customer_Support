server:
  port: 8080

spring:
  application:
    name: customer-support-ai-patterns
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3.2:latest}
        temperature: 0.1
      init:
        pull-model-strategy: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.ai: INFO
