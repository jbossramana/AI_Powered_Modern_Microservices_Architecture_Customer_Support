server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: langchain4j-enterprise-ai-feature-lab
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
support:
  provider: ${SUPPORT_PROVIDER:ollama}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model-name: ${OLLAMA_CHAT_MODEL:llama3.2:latest}
    temperature: ${OLLAMA_TEMPERATURE:0.2}
  openai:
    model-name: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
logging:
  level:
    com.acmesupport: INFO
    dev.langchain4j: INFO
